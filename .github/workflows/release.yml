name: VulnHarvest native portable validation

on:
  push:
    branches: ["codex/portable-v0.0.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native-${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, goos: windows, goarch: amd64 }
          - { os: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64 }
          - { os: macos-15, goos: darwin, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner=$(uname -s) machine=$(uname -m) goos=$(go env GOOS) goarch=$(go env GOARCH)"
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
          printf 'Source SHA: `%s`\n\nNative runner: `%s %s`; Go: `%s/%s`\n' "$GITHUB_SHA" "$(uname -s)" "$(uname -m)" "$(go env GOOS)" "$(go env GOARCH)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend and embedded native package
        shell: bash
        env:
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_MOCK: "0"
          NEXT_PUBLIC_SSE_BASE: ""
        run: |
          set -euxo pipefail
          npm ci --prefix web
          go run ./cmd/portablebuild --target "${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Portable startup, storage and lock smoke
        shell: bash
        run: |
          set -euxo pipefail
          smoke_log="$RUNNER_TEMP/ci-native-smoke-${{ matrix.goos }}-${{ matrix.goarch }}.log"
          smoke_code=0
          go run ./cmd/portablesmoke "dist/VulnHarvest-v0.0.1-${{ matrix.goos }}-${{ matrix.goarch }}.zip" > "$smoke_log" 2>&1 || smoke_code=$?
          cat "$smoke_log" || true
          if [ "$smoke_code" -ne 0 ]; then
            set +x
            # Keep public check-run annotations bounded and escape workflow command data.
            diagnostic=$(tail -n 60 "$smoke_log") || diagnostic="Unable to read native smoke log"
            if [ "${#diagnostic}" -gt 12000 ]; then
              diagnostic="${diagnostic: -12000}"
            fi
            diagnostic="${diagnostic//%/%25}"
            diagnostic="${diagnostic//$'\r'/%0D}"
            diagnostic="${diagnostic//$'\n'/%0A}"
            printf '::error title=Native portable smoke::%s\n' "$diagnostic" || true
          fi
          exit "$smoke_code"
      - name: Prepare bounded test failure annotations
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ci-business-annotations.js" <<'JS'
          const fs = require('node:fs');
          const [log, title] = process.argv.slice(2);
          const lines = fs.readFileSync(log, 'utf8').replace(/\r\n/g, '\n').replace(/\n+$/, '').split('\n');
          const failure = /(?:^|\s)--- FAIL:|^FAIL(?:\s|$)|^panic:|^fatal error:|^# |(?:^|\s)\S+\.go:\d+(?::\d+)?:/;
          const names = new Set(), context = new Set();
          for (let i = 0; i < lines.length; i++) {
            const test = lines[i].match(/(?:^|\s)--- FAIL:\s+(\S+)/);
            const pkg = lines[i].match(/^FAIL\s+(\S+)/);
            if (test) names.add(`test ${test[1]}`);
            if (pkg) names.add(`package ${pkg[1]}`);
            if (/^(?:panic:|fatal error:|# )/.test(lines[i])) names.add(lines[i].slice(0, 300));
            if (failure.test(lines[i])) {
              for (let j = Math.max(0, i - 6); j <= Math.min(lines.length - 1, i + 3); j++) context.add(j);
            }
          }
          function chunks(text, bytes = 2000) {
            // Escape other controls before bounding; keep Unicode code points intact.
            text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, c => `\\x${c.charCodeAt(0).toString(16).padStart(2, '0')}`);
            const parts = []; let part = '', size = 0;
            for (const c of text) {
              const n = Buffer.byteLength(c);
              if (size + n > bytes) { parts.push(part); part = ''; size = 0; }
              part += c; size += n;
            }
            if (part) parts.push(part);
            return parts;
          }
          function emit(section, parts) {
            parts.forEach((part, i) => {
              const escaped = part.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
              console.log(`::error title=${title} ${section} chunk ${i + 1}/${parts.length}::${escaped}`);
            });
          }
          const summary = [...names].join('\n') || 'No named Go test/package failure found';
          const summaryParts = chunks(summary);
          emit('summary', [summaryParts.length > 1 ? chunks(summary, 1960)[0] + '\n[summary truncated]' : summaryParts[0]]);
          emit('context', chunks([...context].sort((a, b) => a - b).slice(0, 60).map(i => [...lines[i]].slice(0, 1000).join('')).join('\n')).slice(0, 4));
          emit('tail', chunks(lines.slice(-60).join('\n')).slice(-2));
          JS
      - name: Task7 SQLite ordinary business suite
        shell: bash
        env:
          ARTEX_TEST_BACKEND: sqlite
        run: |
          set -euxo pipefail
          export ARTEX_CONFIG="$RUNNER_TEMP/task7-isolated-config.json"
          printf '{}' > "$ARTEX_CONFIG"
          export ARTEX_PG_DSN='' TASK2_PG_DSN='' ARTEX_ASSET_TEST_PG_DSN='' ARTEX_TASK_TEST_PG_DSN='' ARTEX_FINDING_TEST_PG_DSN='' ARTEX_ARCHIVE_TEST_PG_DSN=''
          export ARTEX_LLM_PROVIDER='' ANTHROPIC_API_KEY='' OPENAI_API_KEY='' ARTEX_REVIEW_LIVE_CONFIG=''
          suite_log="$RUNNER_TEMP/ci-business-sqlite-${{ matrix.goos }}-${{ matrix.goarch }}.log"
          if go test -p 1 -count=1 -timeout=20m ./... > "$suite_log" 2>&1; then
            cat "$suite_log" || true
            printf '\nSQLite ordinary full suite: **PASS**\n\n`ARTEX_TEST_BACKEND=sqlite go test -p 1 -count=1 -timeout=20m ./...`\n' >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            cat "$suite_log" || true
            printf '\nSQLite ordinary full suite: **FAIL (exit %s)**\n\n`ARTEX_TEST_BACKEND=sqlite go test -p 1 -count=1 -timeout=20m ./...`\n' "$code" >> "$GITHUB_STEP_SUMMARY"
            set +x
            node "$RUNNER_TEMP/ci-business-annotations.js" "$suite_log" 'SQLite ordinary full suite' || true
            exit "$code"
          fi
      - name: Task7 scoped nested SDK tests
        shell: bash
        run: |
          set -euxo pipefail
          suite_log="$RUNNER_TEMP/ci-business-nested-${{ matrix.goos }}-${{ matrix.goarch }}.log"
          if bash portable/task7-nested-tests.sh > "$suite_log" 2>&1; then
            cat "$suite_log" || true
            printf '\nNested SDK gate: **PASS** (patched norma tool/mcp scope; full proxy package). See commands in `portable/task7-nested-tests.sh`.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            cat "$suite_log" || true
            printf '\nNested SDK gate: **FAIL (exit %s)** (patched norma tool/mcp scope; full proxy package).\n' "$code" >> "$GITHUB_STEP_SUMMARY"
            set +x
            node "$RUNNER_TEMP/ci-business-annotations.js" "$suite_log" 'Nested SDK gate' || true
            exit "$code"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VulnHarvest-v0.0.1-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
