name: VulnHarvest native portable validation

on:
  push:
    branches: ["codex/portable-v0.0.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native-${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, goos: windows, goarch: amd64 }
          - { os: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64 }
          - { os: macos-15, goos: darwin, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner=$(uname -s) machine=$(uname -m) goos=$(go env GOOS) goarch=$(go env GOARCH)"
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend and embedded native package
        shell: bash
        env:
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_MOCK: "0"
          NEXT_PUBLIC_SSE_BASE: ""
        run: |
          set -euxo pipefail
          npm ci --prefix web
          go run ./cmd/portablebuild --target "${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Portable startup, storage and lock smoke
        shell: bash
        run: |
          set -euxo pipefail
          go run ./cmd/portablesmoke "dist/VulnHarvest-v0.0.1-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
      - name: Task7 SQLite ordinary business suite
        shell: bash
        env:
          ARTEX_TEST_BACKEND: sqlite
        run: |
          set -euxo pipefail
          if test -f portable/task7-business-ready; then
            go test -p 1 -count=1 -timeout=20m ./...
          else
            echo 'DEFERRED: Task7 ordinary SQLite factories/harness not integrated yet.'
          fi
      - name: Task7 scoped nested SDK tests
        shell: bash
        run: |
          set -euxo pipefail
          if test -f portable/task7-nested-tests.sh; then
            bash portable/task7-nested-tests.sh
          else
            echo 'DEFERRED: Task7 patched-scope nested SDK gate and baseline classification.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VulnHarvest-v0.0.1-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
